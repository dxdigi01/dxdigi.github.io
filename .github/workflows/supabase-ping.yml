name: Keep Supabase Alive

on:
  schedule:
    # Her gün saat 12:00'de çalıştır (Supabase 7 gün sınırına asla takılmaz)
    - cron: '0 12 * * *'
  workflow_dispatch: # Manuel çalıştırma butonu

permissions:
  contents: write # Repoya aktivite kaydı yazabilmesi için gerekli

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase License API
        run: |
          echo "Supabase pingleniyor..."
          curl -s -i -X POST "https://joxqoyfcwipvjazeenod.supabase.co/functions/v1/check-license" \
            -H "Content-Type: application/json" \
            -d '{"device_id": "cron-job-ping-bot"}'

      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Keep Repo Active (60 Günlük Kuralı Engeller)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          date -u > .github/last-ping.txt
          git add .github/last-ping.txt
          git commit -m "chore: keep repo and supabase alive [skip ci]" || exit 0
          git push
